version: 2

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      - shadow

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 30

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - whyNoLint

  funlen:
    lines: 120
    statements: 60

  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

linters:
  disable-all: true
  enable:
    - errcheck        # Check for unchecked errors
    - govet          # Vet examines Go source code
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Staticcheck is a go vet on steroids
    - unused         # Check for unused code
    - goconst        # Find repeated strings that could be constants
    - gocyclo        # Check cyclomatic complexity
    - dupl           # Check for duplicate code
    - misspell       # Find misspelled words
    - unparam        # Find unused function parameters
    - nakedret       # Find naked returns
    - prealloc       # Find slice declarations that could be preallocated
    - copyloopvar    # Check for pointers to enclosing loop variables
    - gocritic       # Comprehensive Go source code linter
    - funlen         # Check function length
   # - revive         # Fast, configurable, extensible, flexible linter - Disabled for AWS SDK naming compatibility
    - gosec          # Security-focused linter

formatters:
  disable-all: true
  enable:
    - gofmt          # Check code formatting
    - goimports      # Check import formatting

issues:
  exclude-rules:
    # Exclude some linters from running on test files
    - path: _test\.go$
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen
        - goconst

    # Exclude gosec false positives about variables named "secret" in a secrets manager
    - linters:
        - gosec
      text: "G101.*secret"

    # Exclude revive naming suggestions for AWS SDK compatibility
    - linters:
        - revive
      text: "(versionId|secretId|versionIds|kmsKeyId|KmsKeyId|VersionId|SecretId|exported|unused-parameter)"

    # Exclude known linters from partially hard-vendored code
    - path: internal/hmac
      linters:
        - gocritic
        - staticcheck
        - gosec

  # Exclude directories
  exclude-dirs:
    - vendor

  # Exclude files
  exclude-files:
    - ".*\\.pb\\.go$"

  # Maximum issues count per one linter
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  max-same-issues: 0

  # Show only new issues created after git revision
  new: false

  # Fix found issues (if it's supported by the linter)
  fix: false

  # Make issues output unique by line
  uniq-by-line: true

run:
  timeout: 5m
  tests: true

output:
  formats:
    colored-line-number:
      path: stdout
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
