version: '3.8'

services:
  secretstash:
    image: ghcr.io/eunmann/secretstash:latest
    # Uncomment to build locally instead of pulling from registry
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: secretstash
    ports:
      - "${PORT:-4566}:4566"
    environment:
      - PORT=4566
      - PERSISTENCE_FILE=/data/secrets.json
    volumes:
      # Mount volume for persistence (optional - comment out for ephemeral storage)
      - secrets-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4566/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  secrets-data:
    driver: local
